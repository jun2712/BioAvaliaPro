project_id = "bioavalia2"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true

[functions.admin-users]
verify_jwt = true

# Public token-based endpoints. The token itself authorizes access; these
# functions never run with the caller's JWT and only use the service role after
# validating the token and input.
[functions.getPublicReport]
verify_jwt = false

[functions.anamnesePublic]
verify_jwt = false

[functions.proteinaPublic]
verify_jwt = false

[functions.anamneseAnalise]
verify_jwt = true

[functions.criarEventoGoogle]
verify_jwt = true

[functions.reagendarEventoGoogle]
verify_jwt = true

[functions.sincronizarAgendaGoogle]
verify_jwt = true

[functions.sincronizarFuturosGoogle]
verify_jwt = true

[functions.statusGoogleAgenda]
verify_jwt = true
